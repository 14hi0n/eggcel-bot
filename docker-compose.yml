services:
  eggcel-bot:
    build:
      context: .

    restart: unless-stopped
    env_file:
      - .env
    volumes: 
      - ./data:/app/data
      - ./assets/prompts:/app/assets/prompts:ro
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-8080}:${WEBHOOK_PORT:-8080}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
      